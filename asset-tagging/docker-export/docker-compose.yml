name: asset-tagging

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: asset-tagging-app
    container_name: asset_tagging_app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      CONTAINER_ROLE: app
    volumes:
      - storage-data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asset-tagging

  queue:
    image: asset-tagging-app
    container_name: asset_tagging_queue
    restart: unless-stopped
    env_file: .env.docker
    environment:
      CONTAINER_ROLE: queue
    depends_on:
      db:
        condition: service_healthy
    networks:
      - asset-tagging

  # Menyalin folder public (termasuk hasil build Vite) ke shared volume agar bisa disajikan nginx
  assets-init:
    image: asset-tagging-app
    container_name: asset_tagging_assets_init
    restart: "no"
    entrypoint: ["sh", "-c", "mkdir -p /mnt/public && cp -r /var/www/html/public/. /mnt/public/"]
    volumes:
      - public-build:/mnt/public

  nginx:
    image: nginx:1.27-alpine
    container_name: asset_tagging_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public-build:/var/www/html/public:ro
    depends_on:
      assets-init:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      - asset-tagging

  db:
    image: postgres:17-alpine
    container_name: asset_tagging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-asset_tagging}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-asset_tagging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - asset-tagging

  # Reverse proxy dengan auto-HTTPS (aktif hanya untuk production/VPS):
  #   docker compose --env-file .env.docker --profile prod up -d
  caddy:
    image: caddy:2-alpine
    container_name: asset_tagging_caddy
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nginx
    networks:
      - asset-tagging

networks:
  asset-tagging:
    driver: bridge

volumes:
  db-data:
  storage-data:
  public-build:
  caddy-data:
  caddy-config:
